name: release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
  # Daily rebuild at 18:00 UTC so the baked CLIs track their upstream releases.
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-24.04-arm
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
    steps:
      - id: meta
        run: |
          DATE=$(date -u +%Y%m%d-%H%M)
          echo "tag=v${DATE}" >> "$GITHUB_OUTPUT"
          echo "name=aarch64 rootfs — ${DATE} UTC" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    # Native arm64 runner: no QEMU, so the CLIs' own arm64 binaries run during
    # the build (every one of them is --version'd by selfcheck.sh).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        distro: [alpine, ubuntu]
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: Build ${{ matrix.distro }}
        run: ./build/build.sh ${{ matrix.distro }}

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-${{ matrix.distro }}
          path: |
            dist/${{ matrix.distro }}-e2e-aarch64-rootfs.tar.gz
            dist/${{ matrix.distro }}-e2e-aarch64-rootfs.tar.gz.sha256
            dist/${{ matrix.distro }}-e2e-aarch64-rootfs.tar.zst
            dist/${{ matrix.distro }}-e2e-aarch64-rootfs.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1

  # The guest GPU image (Mesa's gfxstream Vulkan ICD for vish-core's
  # vulkan_memory_budget case). Self-hosted ubuntu group, which is amd64, so the
  # arm64 rootfs is built under QEMU; it bakes no CLIs, so nothing slow runs
  # emulated.
  build-gpu:
    needs: meta
    runs-on:
      group: ubuntu
      labels: large
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build ubuntu-26.04
        run: ./build/build.sh ubuntu-26.04

      - uses: actions/upload-artifact@v4
        with:
          name: rootfs-ubuntu-26.04
          path: |
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.gz
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.gz.sha256
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.zst
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.zst.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [meta, build, build-gpu]
    # A failed GPU image does not hold back the daily alpine/ubuntu release; the
    # consumer then finds no ubuntu-26.04 asset and its GPU case fails loudly.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rootfs-*
          merge-multiple: true

      - name: List assets
        run: ls -lah dist && cat dist/*.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          make_latest: "true"
          generate_release_notes: false
          files: |
            dist/alpine-e2e-aarch64-rootfs.tar.gz
            dist/alpine-e2e-aarch64-rootfs.tar.gz.sha256
            dist/alpine-e2e-aarch64-rootfs.tar.zst
            dist/alpine-e2e-aarch64-rootfs.tar.zst.sha256
            dist/ubuntu-e2e-aarch64-rootfs.tar.gz
            dist/ubuntu-e2e-aarch64-rootfs.tar.gz.sha256
            dist/ubuntu-e2e-aarch64-rootfs.tar.zst
            dist/ubuntu-e2e-aarch64-rootfs.tar.zst.sha256
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.gz
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.gz.sha256
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.zst
            dist/ubuntu-26.04-e2e-aarch64-rootfs.tar.zst.sha256

  # Every artifact of this run goes when the run ends, pass or fail: the
  # rootfs images are ~1 GB each and artifact storage is an org-wide quota
  # (a full quota fails every other repo's uploads too).
  cleanup:
    needs: [build, build-gpu, release]
    if: always()
    runs-on: ubuntu-24.04-arm
    permissions:
      actions: write
    steps:
      - name: delete this run's artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          n=0
          for id in $(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '.artifacts[].id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            n=$((n + 1))
          done
          echo "deleted $n artifact(s) of run $GITHUB_RUN_ID"
